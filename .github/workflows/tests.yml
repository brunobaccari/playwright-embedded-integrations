name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verificar parser e gate do summary
        run: python3 scripts/summary.py --self-test
      - name: Verificar arquivos versionados
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            printf 'Arquivos ignorados versionados:\n%s\n' "$tracked"
            exit 1
          fi
      - run: cp .env.example .env
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Executar testes
        id: tests
        run: npm test
      - name: Resumo dos testes e completude
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXPECTED_TESTS: '7'
          JUNIT_PATTERN: 'test-results/junit.xml'
          SUMMARY_FILE: 'test-results/summary.md'
          TEST_SCOPE: 'Playwright / Chromium. Iframes hospedados e controles reais de player; sem injeção de estado.'
        run: python3 scripts/summary.py
      - name: Publicar evidências
        uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar relatórios e evidências](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nArtifact indisponível; confira a etapa de upload.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
